<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>只读预览 · Bro Relay Debug</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Bro Relay Debug</p>
        <h1>只读预览</h1>
      </div>
      <span class="state-pill" aria-label="代理在后台执行">代理在后台执行</span>
      <button id="stopTakeover" class="stop-button" type="button">停止并接管</button>
    </header>

    <section class="preview-card" aria-labelledby="previewTitle">
      <div class="preview-heading">
        <h2 id="previewTitle">等待画面</h2>
        <time id="capturedAt" hidden></time>
      </div>
      <div id="imageFrame" class="image-frame" aria-live="polite">
        <img id="previewImage" alt="远程页面截图" draggable="false" hidden>
        <div id="pointerLayer" class="pointer-layer" hidden>
          <div class="target" hidden></div>
          <div class="cursor" aria-hidden="true"></div>
          <div class="label" hidden></div>
        </div>
        <p id="emptyState">正在获取远程画面…</p>
      </div>
      <p id="updateStatus" class="status" role="status" aria-live="polite">代理在后台执行，画面将自动更新。</p>
    </section>

    <p class="hint">停止所有代理任务，后台将恢复原页。</p>
  </main>
  <script type="module" src="preview.js"></script>
</body>
</html>
